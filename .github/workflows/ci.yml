name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Tests run with SAM disabled and Gemini faked, so PyTorch is not needed here.
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: Frontend checks & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    name: End-to-end (browser)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "Start API (AI disabled: demo flows need no quota)"
        working-directory: backend
        env:
          ENABLE_SAM: "false"
          ENABLE_DEPTH: "false"
          GEMINI_API_KEY: ""
          CORS_ORIGINS: http://localhost:3000
        run: |
          pip install -r requirements.txt
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          curl --retry 30 --retry-delay 2 --retry-connrefused -fsS http://localhost:8000/api/health

      - name: Build & start web app
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm ci
          npm run build
          nohup npm run start -- --port 3000 > ../web.log 2>&1 &
          curl --retry 30 --retry-delay 2 --retry-connrefused -fsS http://localhost:3000 > /dev/null

      - name: Run Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            api.log
            web.log
