name: Keep API awake

# A free Hugging Face Space sleeps after ~48 h without traffic and then needs a minute or two to wake.
# A light health check twice a day keeps it ready for whoever opens the app next.
# Set the repository variable API_HEALTH_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://<user>-<space>.hf.space/api/health. Without it, this workflow does nothing.

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_HEALTH_URL != '' }}
    steps:
      - name: Ping the API (waits for a cold start)
        run: curl --retry 12 --retry-delay 15 --retry-all-errors --max-time 60 -fsS "${{ vars.API_HEALTH_URL }}"
